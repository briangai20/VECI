# Revisa cada cambio que se sube a GitHub: errores de código, tipos y build.
# Si algo falla, el cambio aparece con una ✗ roja en GitHub.
name: Revisar la app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  revisar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Valores de relleno: el build no se conecta a Supabase, solo los necesita
      # para no frenarse (ver web/next.config.ts). Lo publicado usa los de Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_relleno
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Errores de código (ESLint)
        run: npx eslint src
      - name: Tipos (TypeScript)
        run: npx next typegen && npx tsc --noEmit
      - name: Build de producción
        run: npx next build
